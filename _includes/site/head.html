<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
<script>
  document.documentElement.classList.replace("no-js", "js");
  try {
    if (localStorage.getItem("theme") === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
</script>
<meta name="theme-color" content="#0c1016">
{% comment %} black-cat icon; bump v= when the icon files change so browsers refetch {% endcomment %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=2" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/images/favicon-192x192.png' | relative_url }}?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}?v=2">
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
